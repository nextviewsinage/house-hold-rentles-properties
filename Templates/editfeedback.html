{% extends 'master.html' %}
{% load static %}
{% block content %}

<main>

  <div class = "container mt-5">
    <div class = " text-center mt -5 ">
  
        <h1></h1>

        
<div class = "container mt-5">
  <div class = " text-center mt -5 ">

      <h1> edit feedback </h1>


    </div>
<main>
<form method="POST" action="/myproject/updatefeedback/{{data.id}}/">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-6 form-group">
        <input name="name" type="text" class="form-control" value="{{data.name}}">
      </div>
      <div class="col-md-6 form-group">
        <input name="email" type="text" class="form-control" value="{{data.email}}">
      </div>
    </div>
    <div class="row">
      <div class="col form-group">
        <input name="Phone" type="text" class="form-control" value="{{data.phone}}">
      </div>
      <div class="row">
        <div class="col form-group">
          <input name="feedback" type="text" class="form-control" value="{{data.feedback}}">
        </div>
    </div>
    <div class="row">
      <div class="col form-group">
        <textarea name="comment" class="form-control" placeholder="Your Comment*"></textarea>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Post Comment</button>

  </form>

  {% endblock %}
