{% extends 'rentalapp/master.html' %}
{% load static %}
{% block content %}
<section class="h-100 h-custom" style="background-color: #8fc4b7;">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-8 col-xl-6">
          <div class="card rounded-3">
            <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
              class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem;"
              alt="Sample photo">

            

            <div class="card-body p-4 p-md-5">
              <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Registration Info</h3>
  
              <form method ="post"class="row g-3 needs-validation"  novalidate>

                {% csrf_token %}
  
                <div class="form-outline mb-4">
                  <input type="text" name='username' id="form3Example1q" class="form-control" />
                  <label class="form-label" for="form3Example1q">Name</label>
                </div>
  
                <div class="row">
                  <div class="col-md-6 mb-4">
  
                    <div class="form-outline datepicker">
                      <input type="date" name='date' class="form-control" id="exampleDatepicker1" />
                      <label for="exampleDatepicker1" class="form-label">Select a date</label>
                    </div>
  
                  </div>
                  <div class="col-md-6 mb-4">
  
                    <select class="select">
                      <option value="1">Gender</option>
                      <option value="2">Female</option>
                      <option value="3">Male</option>
                      <option value="4">Other</option>
                    </select>
  
                  </div>
                <div class="row mb-4 pb-2 pb-md-0 mb-md-5">
                  <div class="col-md-6">
  
                    <div class="form-outline">
                      <input type="text" id="form3Example1w" class="form-control" />
                      <label class="form-label" for="form3Example1w">Password</label>
                    </div>
                    <div class="form-outline form-white mb-4">
                    <input type="text" name='password1' class="form-control form-control-lg" />
                    <label class="form-label" for="typePasswordX">confirm Password</label>
                  </div>
                  <div class="text-center mt-5">
                        <button type="submit" class="btn btn-success btn-lg mb-1">Submit</button>
                  </div>
              </form>
  
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  {% endblock %}
