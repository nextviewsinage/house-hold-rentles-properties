{% extends 'rentalapp/master.html' %}
{% load static %}
{% block content %}


<div class="container mt-5">
    <div class="text-center">
        <h1 class="mb-4"> product page</h1>
    </div>
    
<main>
<form method="POST" action="/rentapp/updateproduct2/{{data.id}}/">
    {% csrf_token %}
    <div class="row mb-3">
        <label for="inputText">Item Name</label>
        <div class="col-sm-10">
            <input type="text" name="name" class="form-control" value="{{data.name}}">
        </div>
    </div>
    <div class="row mb-3">
        <label for="inputEmail">Item Price</label>
        <div class="col-sm-10">
            <input type="number" name="price" class="form-control"value="{{data.price}}">
        </div>
    </div>
    <div class="row mb-3">
        <label for="inputEmail">Item details</label>
        <div class="col-sm-10">
            <input type="text" name="details" class="form-control"value="{{data.details}}">
        </div>
    </div>
        {% comment %} <div class="row mb-3">
            <label for="form_category">Category Name </label>
            <div class="col-sm-10">
                <select class="form-control" name="category" required>
                    {% for cat in category %}
                        <option value="{{ cat.id }}" {% if cat.id == data.category.id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                    {% endfor %} 
                </select>
            </div>
        </div> {% endcomment %}
    <div class="row mb-3">
        <label for="form_photo">product image *</label>
        <div class="col-sm-10">
            <input id="form_photo" type="photo" name="image" placeholder="Please enter status*" value="{{data.image}}">
        </div>
    

    <div class="text-center mt-5">
        <label class="col-sm-2 col-form-label"></label>
        <div class="col-sm-10">
            <a href="{% url 'index3' %}" class="btn btn-primary">Back to Home</a>
            <a href="{% url 'index3' %}" class="btn btn-primary">Submit</a>
        </div>
    </div>
</form><!-- End General Form Elements -->
</div>
</div>
</div>
</div>
</section>

</main><!-- End #main -->
{% endblock %}


<style>
    .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    .table th,
    .table td {
        border: 1px solid #dee2e6;
        padding: 8px;
    }

    .table th {
        background-color: #343a40;
        color: #fff;
    }

    .table tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    .btn {
        display: inline-block;
        font-weight: 400;
        color: #212529;
        text-align: center;
        vertical-align: middle;
        cursor: pointer;
        border: 1px solid transparent;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 0.25rem;
        transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
            border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .btn-primary {
        color: #fff;
        background-color: #007bff;
        border-color: #007bff;
    }

    .btn-primary:hover {
        color: #fff;
        background-color: #0056b3;
        border-color: #0056b3;
    }

    .btn-danger {
        color: #fff;
        background-color: #dc3545;
        border-color: #dc3545;
    }

    .btn-danger:hover {
        color: #fff;
        background-color: #c82333;
        border-color: #bd2130;
    }

</style>
