{% extends 'ownerapp/master.html' %}
{% load static %}
{% block content %}

<main id="main" class="main">

    <div class="pagetitle">
        <h1>Manage Item</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
                <li class="breadcrumb-item">Forms</li>
                <li class="breadcrumb-item active">Manage Item</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row">
            <div class="col-lg-6">

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Manage Item</h5>

                        <!-- General Form Elements -->
                        <form method="POST">
                            {% csrf_token %}
                            <div class="row mb-3">
                                <label for="inputText">Item Name</label>
                                <div class="col-sm-10">
                                    <input type="text" name="name" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="inputEmail">Item Price</label>
                                <div class="col-sm-10">
                                    <input type="number" name="price" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="inputEmail">Item details</label>
                                <div class="col-sm-10">
                                    <input type="text" name="details" class="form-control">
                                </div>
                            </div>
                            
                            

                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label"></label>
                                <div class="col-sm-10">
                                    <button type="submit" class="btn btn-primary">Submit Form</button>
                                </div>
                            </div>
                        </form><!-- End General Form Elements -->
                    </div>
                </div>
            </div>
        </div>
    </section>

</main><!-- End #main -->
{% endblock %}
