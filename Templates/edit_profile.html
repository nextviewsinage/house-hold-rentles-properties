{% extends 'master.html' %}
{% load static %}
{% block content %}

<style>
  .edit-wrapper { background:#f4f6f9; min-height:100vh; padding:100px 0 60px 0; }
  .edit-card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,0.09); padding:40px; max-width:700px; margin:0 auto; }
  .edit-card h2 { font-size:24px; font-weight:800; color:#2d3748; margin-bottom:6px; }
  .edit-card p { color:#718096; font-size:14px; margin-bottom:24px; }
  .divider { border:none; border-top:1.5px solid #f0f0f0; margin:20px 0; }
  .section-label { font-size:13px; font-weight:700; text-transform:uppercase; color:#888; margin-bottom:14px; letter-spacing:.5px; }
  .form-group { margin-bottom:16px; }
  .form-label { font-weight:600; color:#444; font-size:14px; display:block; margin-bottom:5px; }
  .form-control { width:100%; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px; box-sizing:border-box; outline:none; transition:border .2s; }
  .form-control:focus { border-color:#4e73df; box-shadow:0 0 0 3px rgba(78,115,223,0.10); }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  .btn-save { background:linear-gradient(135deg,#4e73df,#224abe); color:#fff; border:none; border-radius:8px; padding:12px 35px; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .2s; }
  .btn-save:hover { opacity:.9; }
  .btn-cancel { background:#f0f0f0; color:#444; border:none; border-radius:8px; padding:12px 25px; font-size:15px; font-weight:600; text-decoration:none; }
  .btn-cancel:hover { background:#e2e8f0; }
</style>

<div class="edit-wrapper">
  <div class="edit-card">
    <h2>✏️ Edit Profile</h2>
    <p>Update your personal details and saved addresses</p>
    <hr class="divider">

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Personal Info -->
      <div class="section-label">👤 Personal Information</div>
      <div class="row-2">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" value="{{ request.user.first_name }}" placeholder="First Name">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" value="{{ request.user.last_name }}" placeholder="Last Name">
        </div>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label class="form-label">📧 Email</label>
          <input type="email" name="email" class="form-control" value="{{ request.user.email }}" placeholder="Email address">
        </div>
        <div class="form-group">
          <label class="form-label">📱 Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ profile.phone|default:'' }}" placeholder="Phone number">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">🖼️ Profile Picture</label>
        <input type="file" name="profile_pic" class="form-control" accept="image/*">
        {% if profile.profile_pic %}
        <small style="color:#888; font-size:12px;">Current: {{ profile.profile_pic }}</small>
        {% endif %}
      </div>

      <hr class="divider">

      <!-- Addresses -->
      <div class="section-label">📍 Manage Addresses</div>
      <div class="form-group">
        <label class="form-label">Address 1 (Primary)</label>
        <input type="text" name="address1" class="form-control" value="{{ profile.address1|default:'' }}" placeholder="Enter primary address">
      </div>
      <div class="form-group">
        <label class="form-label">Address 2</label>
        <input type="text" name="address2" class="form-control" value="{{ profile.address2|default:'' }}" placeholder="Enter secondary address">
      </div>
      <div class="form-group">
        <label class="form-label">Address 3</label>
        <input type="text" name="address3" class="form-control" value="{{ profile.address3|default:'' }}" placeholder="Enter another address">
      </div>
      <div class="row-3">
        <div class="form-group">
          <label class="form-label">City</label>
          <input type="text" name="city" class="form-control" value="{{ profile.city|default:'' }}" placeholder="City">
        </div>
        <div class="form-group">
          <label class="form-label">State</label>
          <input type="text" name="state" class="form-control" value="{{ profile.state|default:'' }}" placeholder="State">
        </div>
        <div class="form-group">
          <label class="form-label">Pincode</label>
          <input type="text" name="pincode" class="form-control" value="{{ profile.pincode|default:'' }}" placeholder="Pincode">
        </div>
      </div>

      <hr class="divider">
      <div style="display:flex; gap:12px;">
        <a href="{% url 'customer_profile' %}" class="btn-cancel">← Cancel</a>
        <button type="submit" class="btn-save">💾 Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
